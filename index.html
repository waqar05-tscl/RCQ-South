<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4fb3">
<title>Right Choice Quest | Maxlox</title>
<style>
:root{--blue:#0649ad;--blue2:#0b5fbe;--searle:#5e91ba;--pink:#e88faa;--ink:#132033;--muted:#687489;--bg:#f4f7fb;--line:#dce4ee;--white:#fff;--green:#17835d;--red:#bf3b49;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eef5fb 0,#f8fafc 36%,#fff 100%);color:var(--ink);min-height:100vh}
button,input{font:inherit} button{cursor:pointer} .shell{min-height:100vh;display:flex;flex-direction:column} 
.brandbar{height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:28px;padding:15px 24px;position:sticky;top:0;z-index:10;box-shadow:0 3px 16px rgba(20,55,95,.06)}
.brandbar img:first-child{width:176px;max-height:54px;object-fit:contain} .brandbar img:last-child{width:220px;max-height:64px;object-fit:contain} .divider{height:42px;width:1px;background:var(--line)}
main{width:min(1080px,calc(100% - 28px));margin:32px auto 44px;flex:1} .footer{padding:18px;text-align:center;color:#7d8795;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 46px rgba(36,72,112,.10)} .hero{display:grid;grid-template-columns:1.4fr .8fr;gap:22px;margin-bottom:22px}
.hero-copy{padding:42px;position:relative;overflow:hidden} .hero-copy:after{content:"✓";position:absolute;right:-25px;bottom:-95px;font-size:260px;font-weight:900;color:rgba(232,143,170,.13);transform:rotate(-8deg)}
.eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eef5ff;border:1px solid #d4e5fb;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1,h2,h3,p{margin-top:0} .title{font-size:52px;line-height:1.02;margin:16px 0 12px;letter-spacing:-.04em} .title span{color:var(--blue)} .subtitle{font-size:19px;line-height:1.55;color:var(--muted);margin-bottom:12px} .tagline{font-weight:800;color:#33435a}
.hero-side{padding:28px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--blue),#123b7a);color:#fff} .metric strong{display:block;font-size:42px;line-height:1} .metric span{display:block;margin-top:8px;opacity:.88;line-height:1.4} .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px} .pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}
.panel{padding:32px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px} .field.full{grid-column:1/-1} label{font-size:13px;font-weight:800;display:block;margin-bottom:7px;color:#46556b} input{width:100%;padding:14px 15px;border:1px solid #cfd8e5;border-radius:12px;background:#fff;outline:none} input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,73,173,.10)} .helper{font-size:12px;color:#8791a0;display:block;margin-top:6px}
.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;transition:.2s} .btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(6,73,173,.19)} .btn-primary:hover{transform:translateY(-1px);background:#063f93} .btn-secondary{background:#eef2f7;color:#263447} .block{width:100%}
.rules{padding:36px} .rules-list{display:grid;gap:13px;margin:24px 0} .rule{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:#f7f9fc;border-radius:14px} .badge{width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900;flex:none} .rule p{margin:3px 0 0;line-height:1.45}
.quiztop{display:grid;grid-template-columns:1fr 160px;gap:16px;margin-bottom:16px} .progressbox,.timer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px} .progressmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#667489;margin-bottom:10px} .track{height:9px;border-radius:99px;background:#e9eef5;overflow:hidden} .bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px} .timer{text-align:center} .timer span{display:block;font-size:12px;color:#7a8797;text-transform:uppercase;font-weight:800;letter-spacing:.08em} .timer strong{font-size:27px;color:var(--blue)} .timer.warn strong{color:var(--red)}
.question{padding:34px} .chip{display:inline-block;font-size:12px;font-weight:800;color:var(--blue);background:#edf5ff;padding:7px 10px;border-radius:999px;margin-bottom:14px} .question h2{font-size:25px;line-height:1.35;margin-bottom:22px}
.options{display:grid;gap:12px} .option{width:100%;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:13px;text-align:left;padding:14px;border:1px solid #d7e0eb;background:#fff;border-radius:14px;color:#263447} .option:hover{border-color:#9fbce2;background:#f7fbff} .option.selected{border:2px solid var(--blue);background:#eef5ff} .letter{width:38px;height:38px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-weight:900} .option.selected .letter{background:var(--blue);color:#fff}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px} .notice{padding:12px 14px;border-radius:12px;margin:12px 0} .notice.error{background:#fff0f2;color:#9d2635} .notice.info{background:#eff6ff;color:#285a99}
.result{overflow:hidden} .resulthead{background:linear-gradient(145deg,var(--blue),#133d7e);color:#fff;text-align:center;padding:36px} .resulthead h1{font-size:60px;margin:10px 0 6px} .scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)} .score{background:#fff;padding:20px;text-align:center} .score span{display:block;color:#7a8797;font-size:12px;text-transform:uppercase;font-weight:800} .score strong{font-size:25px;margin-top:6px;display:block} .review{padding:28px} .reviewitem{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:12px;padding:15px;margin-bottom:12px} .reviewitem.wrong{border-left-color:var(--red)} .reviewq{font-weight:800;margin-bottom:7px} .reviewa{font-size:14px;line-height:1.5} .reviewexp{margin-top:8px;color:#697588;font-size:13px;line-height:1.5}
.adminlink{position:fixed;right:14px;bottom:14px;background:#17243a;color:#fff;padding:10px 13px;border-radius:999px;font-size:12px;opacity:.85} .admin{padding:28px} .admin h2{margin-bottom:18px} table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left} th{font-size:12px;text-transform:uppercase;color:#788596} .admincards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0} .admincard{background:#f5f8fb;border-radius:14px;padding:15px} .admincard span{display:block;color:#7b8796;font-size:12px} .admincard strong{font-size:25px}
@media(max-width:760px){.brandbar{height:76px;gap:16px}.brandbar img:first-child{width:120px}.brandbar img:last-child{width:150px}main{margin-top:18px}.hero{grid-template-columns:1fr}.hero-copy{padding:27px}.title{font-size:39px}.hero-side{gap:24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quiztop{grid-template-columns:1fr 120px}.question{padding:22px}.question h2{font-size:21px}.scoregrid{grid-template-columns:1fr}.admincards{grid-template-columns:1fr 1fr}.admin{overflow:auto}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
.rm-launch{padding:32px}
.rm-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.qr-layout{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;align-items:start;margin:20px 0}
.qr-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.qr-box{width:100%;max-width:360px;aspect-ratio:1;margin:12px auto;display:grid;place-items:center;background:#fff;padding:12px;border:1px solid var(--line);border-radius:16px}
.qr-box img,.qr-box canvas{max-width:100%;height:auto!important}
.session-meta{display:grid;gap:10px}
.session-meta .meta{background:#f5f8fb;border-radius:14px;padding:14px}
.session-meta .meta span{display:block;color:#7b8796;font-size:12px;text-transform:uppercase;font-weight:800}
.session-meta .meta strong{display:block;margin-top:4px;font-size:18px}
.fullqr{position:fixed;inset:0;background:#fff;z-index:9999;display:none;align-items:center;justify-content:center;padding:30px;text-align:center}
.fullqr.show{display:flex}
.fullqr-inner{width:min(760px,96vw)}
.fullqr-code{width:min(560px,80vw);aspect-ratio:1;margin:18px auto;display:grid;place-items:center}
.fullqr-code img,.fullqr-code canvas{max-width:100%;height:auto!important}
.fullqr h1{font-size:42px;margin-bottom:4px;color:var(--blue)}
.rm-login-note{font-size:13px;color:#667489;margin-top:10px}
@media(max-width:760px){.qr-layout{grid-template-columns:1fr}.fullqr h1{font-size:30px}}
</style>

</head>

const QUESTIONS=[{"id":1,"section":"Right Choice Quest","question":"Moxifloxacin's dual targeting of DNA gyrase and topoisomerase IV is clinically significant mainly because it:","options":[{"id":"A","text":"Lowers the probability of single-step mutant resistance"},{"id":"B","text":"Broadens activity against Pseudomonas species"},{"id":"C","text":"Removes the need for renal dose adjustment"},{"id":"D","text":"Extends the elimination half-life substantially"}],"correct":"A","explanation":"Two required target mutations raise the mutant prevention threshold."},{"id":2,"section":"Right Choice Quest","question":"\"Lung-penetrating\" clinically refers to moxifloxacin achieving:","options":[{"id":"A","text":"Concentrations confined largely to plasma"},{"id":"B","text":"High epithelial lining fluid (ELF) and mucosal levels"},{"id":"C","text":"Urinary levels far exceeding serum values"},{"id":"D","text":"Minimal entry into intracellular compartments"}],"correct":"B","explanation":"High ELF/tissue penetration underpins respiratory use."},{"id":3,"section":"Right Choice Quest","question":"High absolute oral bioavailability (~91%) is leveraged mainly to allow:","options":[{"id":"A","text":"Same-dose IV-to-oral step-down therapy"},{"id":"B","text":"Routine halving of the oral maintenance dose"},{"id":"C","text":"Continued IV administration throughout"},{"id":"D","text":"Reduced anaerobic spectrum on switching"}],"correct":"A","explanation":"Near-complete absorption permits same-dose PO switch."},{"id":4,"section":"Right Choice Quest","question":"In Community-Acquired Pneumonia, monotherapy advantage over a beta-lactam alone is:","options":[{"id":"A","text":"Additional bacterial cell-wall inhibition"},{"id":"B","text":"Coverage of typical plus atypical pathogens"},{"id":"C","text":"A guaranteed reduction in resistance rates"},{"id":"D","text":"Meaningful antifungal spectrum coverage"}],"correct":"B","explanation":"Beta-lactams miss atypicals; moxifloxacin covers both."},{"id":5,"section":"Right Choice Quest","question":"Against macrolide-resistant S. pneumoniae, moxifloxacin's edge over azithromycin is:","options":[{"id":"A","text":"A complete absence of QT effect"},{"id":"B","text":"Established safety in all pregnancies"},{"id":"C","text":"Freedom from any CYP considerations"},{"id":"D","text":"Reliable activity against resistant pneumococci"}],"correct":"D","explanation":"Note: both classes prolong QT, so this is not a QT advantage."},{"id":6,"section":"Right Choice Quest","question":"Acute Exacerbation of Chronic Bronchitis (AECB) risk classification favoring a respiratory fluoroquinolone includes:","options":[{"id":"A","text":"A first mild exacerbation without risk factors"},{"id":"B","text":"A clearly viral exacerbation without sputum change"},{"id":"C","text":"Frequent exacerbations with marked airflow obstruction"},{"id":"D","text":"Age below forty with no comorbid disease"}],"correct":"C","explanation":"Risk-stratified use targets complicated patients; note limited antipseudomonal cover."},{"id":7,"section":"Right Choice Quest","question":"A CAP patient afebrile ≥24 h, stable, tolerating oral intake on IV moxifloxacin should:","options":[{"id":"A","text":"Switch to oral 400 mg once daily, same dose"},{"id":"B","text":"Complete the full IV course regardless"},{"id":"C","text":"Reduce to half dose on the oral route"},{"id":"D","text":"Add a macrolide for combination cover"}],"correct":"A","explanation":"Meets switch criteria; step down same-dose."},{"id":8,"section":"Right Choice Quest","question":"CAP / Acute Bacterial Sinusitis / AECB durations are:","options":[{"id":"A","text":"5 days / 5 days / 3–5 days"},{"id":"B","text":"14 days / 21 days / 10–14 days"},{"id":"C","text":"7 days / 10 days / 14 days"},{"id":"D","text":"10 days / 7 days / 5–10 days"}],"correct":"D","explanation":"CAP 10, sinusitis 7, AECB 5–10 days."},{"id":9,"section":"Right Choice Quest","question":"Moxifloxacin's respiratory efficacy reflects concentration-dependent killing because:","options":[{"id":"A","text":"Response tracks time above MIC mainly"},{"id":"B","text":"It concentrates almost solely in plasma"},{"id":"C","text":"High local Cmax raises tissue AUC/MIC"},{"id":"D","text":"It depends on combination partner drugs"}],"correct":"C","explanation":"Tissue AUC/MIC at the site drives response."},{"id":10,"section":"Right Choice Quest","question":"A cited advantage of moxifloxacin over ciprofloxacin in respiratory infection is:","options":[{"id":"A","text":"Superior coverage of Pseudomonas species"},{"id":"B","text":"Enhanced pneumococcal and atypical activity"},{"id":"C","text":"Elimination that is purely renal in route"},{"id":"D","text":"A markedly lower QT-prolongation effect"}],"correct":"B","explanation":"Ciprofloxacin keeps antipseudomonal edge; moxifloxacin gains Gram-positive/atypical."},{"id":11,"section":"Right Choice Quest","question":"Regarding renal dosing, moxifloxacin:","options":[{"id":"A","text":"Requires routine dose reduction in impairment"},{"id":"B","text":"Is contraindicated in any renal impairment"},{"id":"C","text":"Needs no adjustment in renal or mild-moderate hepatic impairment"},{"id":"D","text":"Must be dialysis-timed in all patients"}],"correct":"C","explanation":"Not dependent on renal/hepatic elimination; not studied in severe hepatic impairment (Child-Pugh\nC)."},{"id":12,"section":"Right Choice Quest","question":"Complicated intra-abdominal infection duration is:","options":[{"id":"A","text":"3–7 days total course"},{"id":"B","text":"5–14 days total course"},{"id":"C","text":"21–28 days total course"},{"id":"D","text":"14–21 days total course"}],"correct":"B","explanation":"5–14 days."},{"id":13,"section":"Right Choice Quest","question":"Moxifloxacin is generally not preferred for uncomplicated UTI because it:","options":[{"id":"A","text":"Achieves lower urinary drug concentrations"},{"id":"B","text":"Lacks any Gram-negative activity at all"},{"id":"C","text":"Is unavailable in an oral formulation"},{"id":"D","text":"Is inactive against every uropathogen"}],"correct":"A","explanation":"Low renal clearance with partial tubular reabsorption gives lower urinary levels."},{"id":14,"section":"Right Choice Quest","question":"Achieving true eradication rather than clinical improvement alone matters because:","options":[{"id":"A","text":"It has no measurable effect on outcomes"},{"id":"B","text":"It only influences the cost of therapy"},{"id":"C","text":"It shortens the drug's elimination half-life"},{"id":"D","text":"Incomplete clearance permits relapse and resistance"}],"correct":"D","explanation":"Survivors relapse and enrich resistant subpopulations."},{"id":15,"section":"Right Choice Quest","question":"To maximize eradication and suppress resistance with a fluoroquinolone, aim to:","options":[{"id":"A","text":"Hold levels just above MIC briefly only"},{"id":"B","text":"Exceed the mutant selection window (high AUC/MIC)"},{"id":"C","text":"Use the lowest dose given intermittently"},{"id":"D","text":"Prioritize trough-based time-dependent cover"}],"correct":"B","explanation":"Driving exposure past the mutant selection window suppresses mutants."},{"id":16,"section":"Right Choice Quest","question":"A COPD patient on theophylline needs an antibiotic for AECB. A comparative advantage of moxifloxacin over ciprofloxacin here is:","options":[{"id":"A","text":"Moxifloxacin avoids the CYP1A2 inhibition that lets ciprofloxacin raise theophylline"},{"id":"B","text":"Moxifloxacin raises theophylline levels more predictably than ciprofloxacin"},{"id":"C","text":"Both drugs demand the same intensive theophylline monitoring"},{"id":"D","text":"Ciprofloxacin has no measurable effect on theophylline clearance"}],"correct":"A","explanation":"Ciprofloxacin inhibits CYP1A2 and can push theophylline to toxic levels; moxifloxacin doesn't share this interaction."},{"id":17,"section":"Right Choice Quest","question":"In a respiratory infection where rapid symptom resolution drives adherence, moxifloxacin's PK profile contributes because:","options":[{"id":"A","text":"Therapeutic effect relies on slow accumulation across the first week"},{"id":"B","text":"Peak site concentrations are reached only after several days of dosing"},{"id":"C","text":"Rapid tissue penetration achieves early therapeutic concentrations at the site"},{"id":"D","text":"A loading-dose regimen is required before steady levels appear"}],"correct":"C","explanation":"Fast, high tissue penetration gives therapeutic site concentrations early in the course."},{"id":18,"section":"Right Choice Quest","question":"For a patient with documented non-severe penicillin allergy needing CAP therapy, moxifloxacin's benefit versus amoxicillin-clavulanate is:","options":[{"id":"A","text":"It offers a narrower, safer spectrum than the penicillin option"},{"id":"B","text":"As a non-beta-lactam, it avoids penicillin cross-reactivity while covering respiratory pathogens"},{"id":"C","text":"It shares partial cross-reactivity but at a lower clinical risk"},{"id":"D","text":"It is contraindicated whenever any drug allergy is documented"}],"correct":"B","explanation":"A structurally unrelated class sidesteps cross-reactivity while retaining respiratory cover."},{"id":19,"section":"Right Choice Quest","question":"A practical dosing advantage of moxifloxacin over levofloxacin in respiratory infection is:","options":[{"id":"A","text":"Fixed 400 mg once-daily dosing with no renal titration"},{"id":"B","text":"Weight-based dosing recalculated at each visit"},{"id":"C","text":"Twice-daily dosing that improves coverage"},{"id":"D","text":"Routine dose reduction across all elderly patients"}],"correct":"A","explanation":"Fixed once-daily dosing without renal adjustment simplifies prescribing."},{"id":20,"section":"Right Choice Quest","question":"For an AECB caused by resistant S. pneumoniae after a beta-lactam failed, the rationale favouring moxifloxacin is:","options":[{"id":"A","text":"It shares the mechanism of the failed beta-lactam"},{"id":"B","text":"A distinct topoisomerase-inhibition mechanism plus activity against resistant pneumococci"},{"id":"C","text":"It guarantees Pseudomonas eradication here"},{"id":"D","text":"It works purely by cell-wall synthesis inhibition"}],"correct":"B","explanation":"A non-beta-lactam mechanism plus reliable anti-pneumococcal activity makes it a rational switch."}];

  const res=await fetch(CLOUD.url+path,{method,headers,body:body!==null?JSON.stringify(body):undefined});
  const txt=await res.text(); let data=null; try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!res.ok){const msg=(data&&data.message)||(data&&data.error_description)||(data&&data.error)||txt||("HTTP "+res.status);throw new Error(msg)}
  return data;
}

  app.innerHTML=`<section class="card admin"><span class="eyebrow">Master Administrator • ${esc(session.status)}</span><h2>${esc(session.session_name)}</h2>

  <div class="admincards"><div class="admincard"><span>Participants</span><strong>${rows.length}</strong></div><div class="admincard"><span>Winner</span><strong>${top?esc(top.name):'—'}</strong></div><div class="admincard"><span>Winning Score</span><strong>${top?top.score+'/'+top.total:'—'}</strong></div><div class="admincard"><span>Best Time</span><strong>${top?duration(top.durationMs):'—'}</strong></div></div>
  <div class="rm-actions"><button id="export" class="btn btn-primary">Download CSV</button><button id="history" class="btn btn-secondary">All Sessions</button></div>
  <table style="margin-top:18px"><thead><tr><th>Rank</th><th>Doctor</th><th>Hospital / Ward</th><th>Contact</th><th>Score</th><th>Time</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>#${i+1}</td><td><strong>${esc(x.name)}</strong></td><td>${esc(x.hospital)} / ${esc(x.ward)}</td><td>${esc(x.contact)}</td><td>${x.score}/${x.total}</td><td>${duration(x.durationMs)}</td></tr>`).join('')||'<tr><td colspan="6">No attempts.</td></tr>'}</tbody></table></section>`;
  document.getElementById("history").onclick=showHistory;
  document.getElementById("export").onclick=()=>{
    const rowsCsv=[['Rank','Region','RM','Session','Doctor','Hospital','Ward','Contact','Score','Total','Time Seconds','Submitted At'],...rows.map((x,i)=>[i+1,session.region_name,session.rm_name,session.session_name,x.name,x.hospital,x.ward,x.contact,x.score,x.total,Math.round(x.durationMs/1000),x.submitted_at])];
    const csv=rowsCsv.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`right-choice-quest-${session.region_name}-${session.session_name}.csv`.replace(/[^a-z0-9._-]+/gi,'-');a.click();URL.revokeObjectURL(u);
  };
 }
 await showHistory();
}

document.getElementById('adminLink').textContent="Master Admin";
document.getElementById('adminLink').onclick=async()=>{
 if(!cloudConfigured()){alert('Cloud database is not configured.');return}
 const email=prompt('Master Admin email');if(email===null)return;
 const password=prompt('Master Admin password');if(password===null)return;
 try{await cloudAdminLogin(email,password);await showAdmin()}catch(e){alert(e.message||'Admin login failed')}
};

async function initApp(){
 clearInterval(adminPoll);clearInterval(rmPoll);
 const params=new URLSearchParams(location.search);
 const managerToken=params.get("manage");
 state.sessionId=params.get("session");
 state.sessionInfo=null;
 if(managerToken){
   await showRmManager(managerToken);
   return;
 }
 if(state.sessionId){
   try{
     const info=await getPublicSession(state.sessionId);
     if(!info||info.status!=="open"){renderSessionUnavailable("This quiz session has been closed or the link is invalid.");return}
     state.sessionInfo=info;
   }catch(err){renderSessionUnavailable(err.message||"Unable to load this quiz session.");return}
 }
 renderWelcome();
}
initApp();
</script>
